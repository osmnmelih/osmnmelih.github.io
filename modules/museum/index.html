<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Interactive Museum of Personal Growth — Osman Melih Cabik</title>
    <meta name="description" content="A gamified e-learning museum experience engineered in Genially, focusing on engagement loops, microlearning, and cognitive retention.">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/images/favicon-192.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #museum-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        /* Floating HUD Controls */
        .hud-overlay {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            opacity: 0.88;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .hud-overlay:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        .hud-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 12, 30, 0.88);
            color: #ffffff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 7px 13px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .hud-btn:hover {
            background: rgba(124, 58, 237, 0.95);
            border-color: rgba(192, 132, 252, 0.85);
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.55);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="museum-wrapper">
        <!-- Floating HUD Overlay -->
        <div class="hud-overlay">
            <a href="../../index.html#projects" class="hud-btn" title="Back to Portfolio">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Portfolio</span>
            </a>
            <button class="hud-btn" onclick="toggleFullscreen()" title="Toggle Browser Fullscreen">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span>Fullscreen</span>
            </button>
        </div>

        <!-- Embedded Genially Canvas (Edge-to-Edge) -->
        <iframe 
            id="museum-iframe"
            src="https://view.genially.com/695d45c871a2d1841c50ba80" 
            type="text/html" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen="true" 
            webkitallowfullscreen="true"
            mozallowfullscreen="true"
            scrolling="yes">
        </iframe>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Fullscreen error:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
